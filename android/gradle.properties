org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# TONE3000 settings. Don't commit your key: set T3K_PUBLISHABLE_KEY in
# local.properties (gitignored), ~/.gradle/gradle.properties, or with -P.
# The key must have <T3K_REDIRECT_SCHEME>://oauth/callback registered as a
# redirect URI.
T3K_API_BASE=https://www.tone3000.com
T3K_REDIRECT_SCHEME=tone3000-example
